name: Azure Landing Zone - Terraform CI/CD

on:

  # =====================================================
  # FEATURE BRANCH PUSH
  # Runs validation only
  # =====================================================
  push:
    branches:
      - 'feature/**'

  # =====================================================
  # PULL REQUEST TO MAIN
  # Runs validation only
  # =====================================================
  pull_request:
    branches:
      - main

  # =====================================================
  # MANUAL TRIGGER
  # =====================================================
  workflow_dispatch:


jobs:

  # =====================================================
  # CI - TERRAFORM VALIDATION
  #
  # Runs on:
  # 1. Feature branch push
  # 2. Pull request targeting main
  #
  # Does NOT run terraform apply
  # =====================================================

  terraform-validation:

    name: Terraform Validation

    if: |
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/heads/feature/')

    runs-on: self-hosted

    defaults:
      run:
        working-directory: environment/dev

    steps:

      # -------------------------------------------------
      # Checkout repository
      # -------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Install Terraform
      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------
      # Initialize Terraform
      # -------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------------------------
      # Check Terraform formatting
      # -------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -------------------------------------------------
      # Validate Terraform configuration
      # -------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------
      # Generate Terraform plan
      # -------------------------------------------------
      - name: Terraform Plan
        run: terraform plan


  # =====================================================
  # CD - PRODUCTION DEPLOYMENT
  #
  # Runs ONLY when code is pushed to main.
  #
  # Normally this happens after a PR is merged.
  # =====================================================

  terraform-production:

    name: Terraform Production Deployment

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: self-hosted

    environment: production

    defaults:
      run:
        working-directory: environment/dev

    steps:

      # -------------------------------------------------
      # Checkout main branch
      # -------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Install Terraform
      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------
      # Initialize Terraform
      # -------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------------------------
      # Check Terraform formatting
      # -------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -------------------------------------------------
      # Validate Terraform configuration
      # -------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------
      # Generate Terraform deployment plan
      # -------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # -------------------------------------------------
      # Apply Terraform plan
      # -------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan