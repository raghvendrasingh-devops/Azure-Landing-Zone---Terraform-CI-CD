name: Azure Landing Zone - Terraform CI/CD

on:

  # =====================================================
  # FEATURE BRANCH PUSH
  # Validation only
  # =====================================================
  push:
    branches:
      - 'feature/**'

  # =====================================================
  # PULL REQUEST TO MAIN
  # Validation only
  # =====================================================
  pull_request:
    branches:
      - main

  # =====================================================
  # MANUAL TRIGGER
  # =====================================================
  workflow_dispatch:


jobs:

  # =====================================================
  # CI - TERRAFORM VALIDATION
  # Feature push + PR to main
  # =====================================================

  terraform-validation:

    name: Terraform Validation

    if: |
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/heads/feature/')

    runs-on: self-hosted

    defaults:
      run:
        working-directory: environment/dev

    steps:

      # -------------------------------------------------
      # Checkout Repository
      # -------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------
      # Azure Login
      # -------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------------
      # Verify Azure Authentication
      # -------------------------------------------------
      - name: Verify Azure Account
        run: az account show --output table

      # -------------------------------------------------
      # Terraform Init
      # -------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------------------------
      # Terraform Format Check
      # -------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------
      - name: Terraform Plan
        run: terraform plan


  # =====================================================
  # CD - PRODUCTION DEPLOYMENT
  # Runs only after merge to main
  # =====================================================

  terraform-production:

    name: Terraform Production Deployment

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: self-hosted

    environment: production

    defaults:
      run:
        working-directory: environment/dev

    steps:

      # -------------------------------------------------
      # Checkout Main
      # -------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------
      # Azure Login
      # -------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------------
      # Verify Azure Authentication
      # -------------------------------------------------
      - name: Verify Azure Account
        run: az account show --output table

      # -------------------------------------------------
      # Terraform Init
      # -------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------------------------
      # Terraform Format Check
      # -------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # -------------------------------------------------
      # Terraform Apply
      # -------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan